<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Vault-9 narrative key art</title>
  <desc id="desc">A cutaway of an underground vault with layered rings, a maintenance runner, signal evidence, factions, and four branching endings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1200" y1="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080b0c"/>
      <stop offset="0.45" stop-color="#101719"/>
      <stop offset="1" stop-color="#1b1111"/>
    </linearGradient>
    <linearGradient id="shaft" x1="420" x2="780" y1="80" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#213136"/>
      <stop offset="0.48" stop-color="#111b1e"/>
      <stop offset="1" stop-color="#070909"/>
    </linearGradient>
    <linearGradient id="signal" x1="500" x2="865" y1="255" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#74f2ce"/>
      <stop offset="1" stop-color="#f1c55f"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <rect x="32" y="32" width="1136" height="456" rx="18" fill="none" stroke="#27383c" stroke-width="2"/>

  <g opacity="0.4">
    <path d="M64 96h1072M64 424h1072" stroke="#314347" stroke-width="2"/>
    <path d="M146 32v456M1054 32v456" stroke="#263438" stroke-width="2"/>
  </g>

  <g transform="translate(295 48)">
    <path d="M156 0h298l88 88v256l-88 88H156L68 344V88z" fill="url(#shaft)" stroke="#3b5358" stroke-width="6"/>
    <path d="M190 42h230l68 68v212l-68 68H190l-68-68V110z" fill="#0b0f10" stroke="#526f73" stroke-width="4"/>

    <g fill="none" stroke-linecap="round">
      <path d="M154 116h300" stroke="#d2a84a" stroke-width="8"/>
      <path d="M130 184h348" stroke="#486368" stroke-width="8"/>
      <path d="M116 252h376" stroke="#74f2ce" stroke-width="8" opacity="0.9"/>
      <path d="M142 320h324" stroke="#b8403a" stroke-width="8"/>
    </g>

    <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#d8f7ee">
      <text x="32" y="120">UPPER RING</text>
      <text x="10" y="188">MID COMMONS</text>
      <text x="0" y="256">LOWER MECHANICA</text>
      <text x="34" y="324">BLACK LEVELS</text>
    </g>

    <g transform="translate(272 194)">
      <circle cx="32" cy="18" r="17" fill="#d8f7ee"/>
      <path d="M32 38v64M5 72h54M32 102l-34 54M32 102l38 54" stroke="#d8f7ee" stroke-width="10" stroke-linecap="round"/>
      <path d="M48 74h74" stroke="#f1c55f" stroke-width="5" stroke-linecap="round"/>
      <rect x="116" y="54" width="62" height="42" rx="4" fill="#12191c" stroke="#f1c55f" stroke-width="3"/>
      <path d="M128 68h38M128 82h26" stroke="#74f2ce" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <g filter="url(#glow)" opacity="0.95">
    <path d="M512 300C618 250 692 196 864 124" fill="none" stroke="url(#signal)" stroke-width="5" stroke-linecap="round"/>
    <path d="M882 112c32 28 32 70 0 98M912 82c58 56 58 126 0 188" fill="none" stroke="#74f2ce" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(822 88)">
    <rect x="0" y="0" width="248" height="160" rx="8" fill="#111619" stroke="#3b5358" stroke-width="3"/>
    <text x="22" y="38" fill="#f1c55f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">B-17 SENSOR SPOOL</text>
    <path d="M24 64h198M24 90h142M24 116h174" stroke="#536d71" stroke-width="5" stroke-linecap="round"/>
    <path d="M24 138h88" stroke="#74f2ce" stroke-width="5" stroke-linecap="round"/>
    <circle cx="205" cy="132" r="13" fill="#74f2ce"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">
    <g transform="translate(98 124)">
      <rect width="172" height="46" rx="8" fill="#12191c" stroke="#526f73"/>
      <text x="24" y="30" fill="#d8f7ee">MECHANICAL</text>
    </g>
    <g transform="translate(92 196)">
      <rect width="178" height="46" rx="8" fill="#12191c" stroke="#b8403a"/>
      <text x="24" y="30" fill="#f5d3cf">STABILITY</text>
    </g>
    <g transform="translate(930 316)">
      <rect width="150" height="46" rx="8" fill="#12191c" stroke="#d2a84a"/>
      <text x="35" y="30" fill="#f7e6b0">KEEPERS</text>
    </g>
    <g transform="translate(930 388)">
      <rect width="172" height="46" rx="8" fill="#12191c" stroke="#74f2ce"/>
      <text x="30" y="30" fill="#d8f7ee">DESCENDERS</text>
    </g>
  </g>

  <g transform="translate(122 382)" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#d8f7ee">
    <path d="M0 0h118M118 0l56-48M118 0l58 0M118 0l56 48M118 0l56 92" stroke="#5c777b" stroke-width="4" stroke-linecap="round"/>
    <text x="190" y="-44">CONTROLLED TRUTH</text>
    <text x="190" y="5">FULL EXPOSURE</text>
    <text x="190" y="54">PRESERVE ORDER</text>
    <text x="190" y="98">EXIT PROTOCOL</text>
  </g>

  <text x="64" y="70" fill="#f5f1df" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700">Vault-9 Keeps Its Own Weather</text>
  <text x="66" y="472" fill="#8da1a4" font-family="Arial, Helvetica, sans-serif" font-size="18">Every repair leaves evidence. Every truth changes the pressure.</text>
</svg>
