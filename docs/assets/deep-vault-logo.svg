<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">The Deep Vault logo</title>
  <desc id="desc">A circular sealed vault mark with signal lines and the title The Deep Vault.</desc>
  <defs>
    <linearGradient id="vaultGlow" x1="70" x2="190" y1="30" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#74f2ce"/>
      <stop offset="0.52" stop-color="#2fb7c8"/>
      <stop offset="1" stop-color="#d2a84a"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="250" x2="730" y1="46" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5f1df"/>
      <stop offset="0.58" stop-color="#d8f7ee"/>
      <stop offset="1" stop-color="#f1c55f"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="760" height="220" rx="18" fill="#0b0d0e"/>
  <rect x="10" y="10" width="740" height="200" rx="12" fill="#111619" stroke="#263438" stroke-width="2"/>

  <g transform="translate(38 22)">
    <circle cx="88" cy="88" r="76" fill="#0b0d0e" stroke="#314347" stroke-width="10"/>
    <circle cx="88" cy="88" r="56" fill="#12191c" stroke="url(#vaultGlow)" stroke-width="5"/>
    <circle cx="88" cy="88" r="20" fill="#0b0d0e" stroke="#e0bd67" stroke-width="5"/>
    <path d="M88 20v34M88 122v34M20 88h34M122 88h34M40 40l24 24M136 40l-24 24M40 136l24-24M136 136l-24-24" stroke="#5b7479" stroke-width="6" stroke-linecap="round"/>
    <path d="M88 88l42-14" stroke="#74f2ce" stroke-width="6" stroke-linecap="round" filter="url(#softGlow)"/>
    <path d="M147 60c17 19 17 37 0 56M162 44c28 34 28 72 0 106" fill="none" stroke="#74f2ce" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M24 164h128" stroke="#d2a84a" stroke-width="5" stroke-linecap="round"/>
    <path d="M48 178h80" stroke="#b8403a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g fill="url(#titleGradient)">
    <text x="232" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" letter-spacing="1">THE DEEP</text>
    <text x="232" y="153" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" letter-spacing="1">VAULT</text>
  </g>
  <text x="236" y="183" fill="#8da1a4" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="3">TRUTH HAS PRESSURE</text>
</svg>
