<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Vault-9 atmospheric background</title>
  <desc id="desc">A dim underground habitat shaft with layered vault decks, maintenance lights, cables, and a distant signal panel.</desc>
  <defs>
    <linearGradient id="wall" x1="0" x2="1800" y1="0" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#060807"/>
      <stop offset="0.36" stop-color="#111817"/>
      <stop offset="0.67" stop-color="#17110f"/>
      <stop offset="1" stop-color="#070908"/>
    </linearGradient>
    <radialGradient id="coreLight" cx="50%" cy="35%" r="55%">
      <stop offset="0" stop-color="#93f0ce" stop-opacity="0.3"/>
      <stop offset="0.42" stop-color="#29443d" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#050706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shaft" x1="680" x2="1120" y1="120" y2="1120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#263835"/>
      <stop offset="0.45" stop-color="#101918"/>
      <stop offset="1" stop-color="#050706"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1800" height="1200" fill="url(#wall)"/>
  <rect width="1800" height="1200" fill="url(#coreLight)"/>

